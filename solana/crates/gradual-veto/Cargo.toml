[package]
name = "gradual-veto"
version = "0.7.2"
edition = "2021"
license = "MIT"
description = "The graduated-veto state machine (spec §6.3) as pure Rust, with no Solana dependency."

# Deliberately empty. This crate is the security core of both programs, so it stays auditable on its
# own and testable without a validator: addresses are `[u8; 32]` rather than `Pubkey`, and the clock
# arrives as an `i64` argument rather than from `Clock::get()`. The programs do the conversion.
[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
