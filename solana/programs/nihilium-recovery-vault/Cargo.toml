[package]
name = "nihilium-recovery-vault"
version = "0.7.2"
edition = "2021"
license = "MIT"
description = "Identity-gated, graduated-veto recovery for a program-owned Solana vault."

[lib]
crate-type = ["cdylib", "lib"]
name = "nihilium_recovery_vault"

[features]
default = ["localnet"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "nihilium-recovery-common/idl-build"]
localnet = ["nihilium-recovery-common/localnet"]
devnet = ["nihilium-recovery-common/devnet"]
mainnet = ["nihilium-recovery-common/mainnet"]

[dependencies]
anchor-lang = "0.31.1"
gradual-veto = { path = "../../crates/gradual-veto" }
nihilium-recovery-common = { path = "../../crates/nihilium-recovery-common", default-features = false }
