[profile.default]
solc_version = "0.8.25"
evm_version = "cancun"
src = "src"
test = "test"
script = "script"
out = "out"
# ModuleKit ships its Solidity dependencies through npm rather than forge submodules, so the
# dependency root is node_modules. `onchain/evm` is deliberately NOT an npm workspace member: it
# installs its own tree, which keeps the contract toolchain independent of the SDK's.
libs = ["node_modules"]
gas_limit = "18446744073709551615"
memory_limit = 2147483648
ignored_warnings_from = ["node_modules"]
optimizer = true
optimizer_runs = 200
# Read-only, and scoped to the fixtures directory: VetoDifferential.t.sol replays traces generated
# by the TypeScript veto machine, which is the oracle both implementations are checked against.
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    # DeployRecoveryModule records the deployed address under deployments/<chainid>.json.
    { access = "read-write", path = "./deployments" },
]

# The graduated veto is a security state machine; a fuzz run that only samples a handful of inputs
# is not evidence about it. These are raised well above the defaults on purpose.
[fuzz]
runs = 2048

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

# Filled in from .env (see .env.example). Foundry loads .env from the project root automatically,
# and resolves ${VAR} here, so `--rpc-url sepolia` works without pasting a URL on the command line.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
# Public endpoints are the default so a dry run needs no signup; override in .env for real traffic.
arbitrum = "${ARBITRUM_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

# Only needed for `--verify`. Deployment succeeds without it; verification is a separate step and
# can be retried with `npm run verify:<chain>`.
#
# One key covers all three: Etherscan's V2 API is multichain, and Foundry routes by the `chain` id
# below. A separate Arbiscan key is no longer needed.
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
